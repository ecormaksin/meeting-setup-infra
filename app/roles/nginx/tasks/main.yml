- name: "Install nginx | install packages"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    pkg:
      - nginx
    update_cache: yes

- name: "Install nginx | start service"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  systemd:
    name: nginx
    enabled: yes
    state: started
