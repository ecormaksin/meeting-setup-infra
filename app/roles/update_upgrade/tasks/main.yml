- name: "update, upgrade, autoremove Ubuntu | update packages"
  become: yes
  ansible.builtin.apt:
    update_cache: yes

- name: "update, upgrade, autoremove Ubuntu | upgrade packages"
  become: yes
  ansible.builtin.apt:
    upgrade: dist

- name: "update, upgrade, autoremove Ubuntu | autoremove packages"
  become: yes
  ansible.builtin.apt:
    autoremove: yes
