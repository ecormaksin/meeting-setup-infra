- name: "db: iptables | list iptables"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  command: iptables -L
  register: iptables_result

- name: "db: iptables | allow postgresql port"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.shell:
    cmd: |
      iptables -I INPUT 6 -p tcp -m tcp --dport postgresql -j ACCEPT
      netfilter-persistent save
  when: iptables_result.stdout.find('tcp dpt:postgresql') == -1

- name: "db: postgresql | install packages"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    pkg:
      - postgresql
    update_cache: yes

- name: "db: postgresql | check listen address"
  become: true
  ignore_errors: true
  ansible.builtin.shell:
    cmd: |
      cat {{ postgresql_conf_path }} | grep -E "listen_addresses = '\*'"
  register: cat_postgresql_conf

- name: "db: postgresql | change listen address"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.replace:
    path: {{ postgresql_conf_path }}
    regexp: '^(#listen_addresses = .*)$'
    replace: '\1\nlisten_addresses = ''*'''
  when: cat_postgresql_conf.rc != 0

- name: "db: postgresql | start service"
  become: yes
  ignore_errors: "{{ ansible_check_mode }}"
  systemd:
    name: postgresql
    enabled: yes
    state: started
