- name: "db: iptables | allow postgresql port"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: postgresql
    jump: ACCEPT

- name: "db: iptables | save"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  community.general.iptables_state:
    state: saved
    path: /etc/sysconfig/iptables

- name: "db: postgresql | install packages"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    pkg:
      - postgresql
      - python-is-python3
      - python3-psycopg2
    update_cache: yes

- name: "db: postgresql | change listen address"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: '^listen_addresses = ''\*''$'
    insertafter: '^#listen_addresses = ''localhost''.*$'
    line: 'listen_addresses = ''*'''

- name: "db: postgresql | allow local trust connection"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.replace:
    path: "{{ pg_hba_conf_path }}"
    regexp: '^local(\s+)all(\s+)(postgres|all)(\s+)peer$'
    replace: 'local\1all\2\3\4trust'

- name: "db: postgresql | allow ip v4 local connections"
  ansible.builtin.include_tasks:
    file: ./roles/db/tasks/allow_ip_v4_local_connections.yml
  vars:
    target_ip_address: "{{ item }}"
  with_items: "{{ postgresql_permitted_ip_addresses }}"

- name: "db: postgresql | start service"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: "db: postgresql | create app admin user"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_user:
    comment: "admin user for meeting-setup"
    login_host: "{{ ansible_host }}"
    login_password: "{{ postgresql_login_password }}"
    login_user: "{{ postgresql_login_user }}"
    name: "{{ app_db_admin_user_name }}"
    password: "{{ app_db_admin_password }}"
    role_attr_flags: "LOGIN,CREATEDB"

- name: "db: postgresql | create app user"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_user:
    comment: "app user for meeting-setup"
    login_host: "{{ ansible_host }}"
    login_user: "{{ postgresql_login_user }}"
    login_password: "{{ postgresql_login_password }}"
    name: "{{ app_db_app_user_name }}"
    password: "{{ app_db_app_password }}"
    role_attr_flags: "LOGIN"

- name: "db: postgresql | create database"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_db:
    login_host: "{{ ansible_host }}"
    login_user: "{{ postgresql_login_user }}"
    login_password: "{{ postgresql_login_password }}"
    name: "{{ app_db_name }}"
    owner: "{{ app_db_admin_user_name }}"
    state: present
    encoding: UTF-8
    lc_collate: ja_JP.UTF-8
    lc_ctype: ja_JP.UTF-8

- name: "db: postgresql | add ansible user to postgres group"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.user:
    append: true
    groups:
      - postgres
    name: "{{ ansible_user }}"

- name: "db: postgresql | create password file"
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.copy:
    content: "*:*:{{ app_db_name }}:{{ app_db_admin_user_name }}:{{ app_db_admin_password }}"
    dest: "/home/{{ ansible_user }}/.pgpass"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: "db: postgresql | copy ddl"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.copy:
    src: schema.sql
    dest: /tmp/schema.sql
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0666'

- name: "db: postgresql | execute ddl"
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.shell:
    chdir: /tmp
    cmd: "psql --dbname={{ app_db_name }} --file=schema.sql --host={{ ansible_host }} --username={{ app_db_admin_user_name }}"

- name: "db: postgresql | grant app user for schema"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_privs:
    login_host: "{{ ansible_host }}"
    login_db: "{{ app_db_name }}"
    login_user: "{{ app_db_admin_user_name }}"
    login_password: "{{ app_db_admin_password }}"
    objs: "{{ item }}"
    privs: USAGE
    roles: "{{ app_db_app_user_name }}"
    type: schema
  loop: "{{ app_db_schemas }}"

- name: "db: postgresql | grant app user for table"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_privs:
    login_host: "{{ ansible_host }}"
    login_db: "{{ app_db_name }}"
    login_user: "{{ app_db_admin_user_name }}"
    login_password: "{{ app_db_admin_password }}"
    objs: ALL_IN_SCHEMA
    privs: INSERT,SELECT,UPDATE,DELETE,REFERENCES
    roles: "{{ app_db_app_user_name }}"
    schema: "{{ item }}"
    type: table
  loop: "{{ app_db_schemas }}"

- name: "db: postgresql | grant app user for sequence"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_privs:
    login_host: "{{ ansible_host }}"
    login_db: "{{ app_db_name }}"
    login_user: "{{ app_db_admin_user_name }}"
    login_password: "{{ app_db_admin_password }}"
    objs: "{{ item.sequense_name }}"
    privs: ALL
    roles: "{{ app_db_app_user_name }}"
    schema: "{{ item.schema_name }}"
    type: sequence
  loop:
    - { schema_name: '日程候補', sequense_name: '日程番号' }
    - { schema_name: '出欠', sequense_name: '都合番号' }

- name: "db: postgresql | grant app user for type"
  become: true
  become_user: "{{ postgresql_login_user }}"
  ignore_errors: "{{ ansible_check_mode }}"
  community.postgresql.postgresql_privs:
    login_host: "{{ ansible_host }}"
    login_db: "{{ app_db_name }}"
    login_user: "{{ app_db_admin_user_name }}"
    login_password: "{{ app_db_admin_password }}"
    objs: "{{ item.type_name }}"
    privs: USAGE
    roles: "{{ app_db_app_user_name }}"
    schema: "{{ item.schema_name }}"
    type: type
  loop:
    - { schema_name: '出欠', type_name: '都合種別' }
