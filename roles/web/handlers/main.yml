- name: "web: nginx | restart service"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: restarted

- name: "web | systemctl reload"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.systemd:
    daemon_reload: true
