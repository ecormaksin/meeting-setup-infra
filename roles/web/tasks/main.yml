- name: "web: iptables | allow postgresql port"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
  loop:
    - https
    - http

- name: "web: iptables | save"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  community.general.iptables_state:
    state: saved
    path: /etc/sysconfig/iptables

- name: "web: nginx | install packages"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    pkg:
      - nginx
    update_cache: yes

- name: "web: nginx | start service"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: "web: cerbot | Install snapd"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    pkg:
      - snapd
    update_cache: yes

- name: "web: cerbot | Ensure that your version of snapd is up to date"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.shell: snap install core; snap refresh core

- name: "web: cerbot | Remove certbot-auto and any Certbot OS packages"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.apt:
    pkg:
      - certbot
    state: absent

- name: "web: cerbot | Install Certbot"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  community.general.snap:
    name: certbot
    classic: true

- name: "web: cerbot | Prepare the Certbot command"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link
    force: true

- name: "web: cerbot | Get and install certificates"
  become: true
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.shell: certbot --nginx --noninteractive --agree-tos -m "{{ certbot_email_address }}" -d "{{ certbot_domain }}"
